name: orbit-hml
services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbit
      POSTGRES_DB: orbit
      POSTGRES_PASSWORD: ${ORBIT_DB_PASSWORD:?required}
    volumes:
      - db:/var/lib/postgresql
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=30, -c, max_wal_size=128MB]
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U orbit -d orbit']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &logs
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
  api:
    image: orbit-hml-api:${ORBIT_RELEASE_SHA:?required}
    restart: unless-stopped
    read_only: true
    user: '10001:10001'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ORBIT_RUNTIME: /run/orbit/runtime.json
      ORBIT_BIND: 0.0.0.0
      ORBIT_API_PORT: '8080'
      ORBIT_KEYS_DIR: /var/lib/orbit/keys
      ORBIT_REPOSITORIES: /var/lib/orbit/repos
      ORBIT_DISABLE_SETUP: ${ORBIT_DISABLE_SETUP:-1}
      ORBIT_PUBLIC_ORIGIN: https://orbit.hml-app.shopair.com.br
      ORBIT_RELEASE_SHA: ${ORBIT_RELEASE_SHA}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    volumes:
      - ./runtime.json:/run/orbit/runtime.json:ro
      - ./data/keys:/var/lib/orbit/keys
      - ./data/repos:/var/lib/orbit/repos
    tmpfs: ['/tmp:rw,nosuid,nodev,size=64m']
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.40
    pids_limit: 96
    logging: *logs
  web:
    image: orbit-hml-web:${ORBIT_RELEASE_SHA:?required}
    restart: unless-stopped
    read_only: true
    user: '10001:10001'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      ORBIT_API_ORIGIN: http://api:8080
      ORBIT_PROXY_TOKEN: ${ORBIT_PROXY_TOKEN:?required}
      ORBIT_PUBLIC_ORIGIN: https://orbit.hml-app.shopair.com.br
      ORBIT_RELEASE_SHA: ${ORBIT_RELEASE_SHA}
      NEXT_TELEMETRY_DISABLED: '1'
    tmpfs: ['/tmp:rw,nosuid,nodev,size=64m']
    depends_on: [api]
    mem_limit: 320m
    cpus: 0.40
    pids_limit: 96
    logging: *logs
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    # Official Caddy binary carries this file capability; dropping it prevents exec.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports: ['127.0.0.1:8089:8080']
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro]
    tmpfs: ['/data:rw,nosuid,nodev,size=16m', '/config:rw,nosuid,nodev,size=16m']
    depends_on: [web]
    mem_limit: 48m
    cpus: 0.10
    pids_limit: 32
    logging: *logs
volumes:
  db:
