<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Orbit</title>
  <style>
    html, body { margin:0; padding:0; font-family: Arial, Segoe UI, sans-serif; }
    #art { width:1080px; height:1350px; box-sizing:border-box; padding:64px; position:relative; background: radial-gradient(circle at top right, #382365, #101325 60%); }

    #logo { margin-bottom:24px; }#logo img { display:block; width:224px; height:64px; }
    #headline { font-size:86px; font-weight:800; line-height:1.18; color:#fff; margin-bottom:22px; }
    #supporting { font-size:34px; color:#fff; margin-bottom:24px; }

    #product { width:100%; height:450px; box-sizing:border-box; margin:0 auto 28px; display:block; border:2px solid violet; border-radius:20px; box-shadow:0 8px 24px rgba(128,0,128,0.5); object-fit:cover; object-position:top; }
    #cta { font-size:40px; background:#39ff14; color:#000; padding:16px 32px; border-radius:24px; text-align:center; display:block; margin:0 auto; }
    #notice { font-size:28px; color:#DCD4FF; text-align:center; margin:28px 0 12px; }
    #origin { font-size:22px; color:#DCD4FF; text-align:center; }
  </style>
</head>
<body>
  <main id="art">
    <div id="logo"><img src="../orbit/brand/orbit-logo-inverse.svg" alt="Orbit" width="224" height="64"></div>
    <div id="headline">Projetos e código em um lugar</div>
    <div id="supporting">Gestão de tarefas e código em um ambiente integrado para equipes de desenvolvimento</div>

    <img id="product" src="../orbit/images/product.png" alt="Captura QA do Orbit com dados fictícios">
    <div id="cta">Solicite uma demonstração</div>
    <div id="notice">Orbit em homologação · condições do piloto a combinar</div>
    <div id="origin">Captura QA · dados fictícios</div>
  </main>
</body>
</html>
